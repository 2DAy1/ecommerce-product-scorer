services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parser_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-parser_mvp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parser_mvp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: backend
    image: parser-mvp-backend:local
    command: ["/app/docker/entrypoint.sh"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-parser_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-parser_mvp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parser_mvp}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@example.com}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
      AMAZON_BEST_SELLERS_URL: ${AMAZON_BEST_SELLERS_URL:-https://www.amazon.com/Best-Sellers/zgbs}
      AMAZON_CATEGORIES: ${AMAZON_CATEGORIES:-}
      AMAZON_PRODUCTS_PER_CATEGORY: ${AMAZON_PRODUCTS_PER_CATEGORY:-10}
      AMAZON_REQUEST_TIMEOUT_SECONDS: ${AMAZON_REQUEST_TIMEOUT_SECONDS:-30}
      AMAZON_HEADLESS: ${AMAZON_HEADLESS:-true}
      TRENDS_GEO: ${TRENDS_GEO:-US}
      TRENDS_PERIOD: ${TRENDS_PERIOD:-today 3-m}
      TRENDS_HEADLESS: ${TRENDS_HEADLESS:-true}
      TRENDS_REQUEST_TIMEOUT_SECONDS: ${TRENDS_REQUEST_TIMEOUT_SECONDS:-30}
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    init: true
    build:
      context: ./backend
      target: worker
    image: parser-mvp-worker:local
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-parser_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-parser_mvp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parser_mvp}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      AMAZON_BEST_SELLERS_URL: ${AMAZON_BEST_SELLERS_URL:-https://www.amazon.com/Best-Sellers/zgbs}
      AMAZON_CATEGORIES: ${AMAZON_CATEGORIES:-}
      AMAZON_PRODUCTS_PER_CATEGORY: ${AMAZON_PRODUCTS_PER_CATEGORY:-10}
      AMAZON_REQUEST_TIMEOUT_SECONDS: ${AMAZON_REQUEST_TIMEOUT_SECONDS:-30}
      AMAZON_HEADLESS: ${AMAZON_HEADLESS:-true}
      TRENDS_GEO: ${TRENDS_GEO:-US}
      TRENDS_PERIOD: ${TRENDS_PERIOD:-today 3-m}
      TRENDS_HEADLESS: ${TRENDS_HEADLESS:-true}
      TRENDS_REQUEST_TIMEOUT_SECONDS: ${TRENDS_REQUEST_TIMEOUT_SECONDS:-30}
    depends_on:
      backend:
        condition: service_healthy

  beat:
    image: parser-mvp-backend:local
    pull_policy: never
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-parser_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-parser_mvp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parser_mvp}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
